name: wireguard-network-manager

services:
  wireguard-network-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wireguard-network-manager:latest
    ports:
      - "127.0.0.1:8080:5000"
    environment:
      - MONGO_URI=mongodb://127.0.0.1:27017/wireguard_manager
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required, see .env.example}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required, see .env.example}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required, see .env.example}
      - "BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-sunday 00:00}"
      - BACKUP_RETENTION=${BACKUP_RETENTION:-12}
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    restart: unless-stopped

volumes:
  mongo_data:
