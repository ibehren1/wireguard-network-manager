[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mongod]
command=/usr/bin/mongod --bind_ip 127.0.0.1 --port 27017 --dbpath /data/db --logpath /var/log/supervisor/mongod.log
autorestart=true
priority=1
startsecs=3
stdout_logfile=/var/log/supervisor/mongod.out.log
stderr_logfile=/var/log/supervisor/mongod.err.log

[program:webapp]
command=/app/.venv/bin/gunicorn -w 2 --worker-class gthread --threads 4 --timeout 60 -b 0.0.0.0:5000 wsgi:app
directory=/app
autorestart=true
priority=2
startsecs=3
stdout_logfile=/var/log/supervisor/webapp.out.log
stderr_logfile=/var/log/supervisor/webapp.err.log
