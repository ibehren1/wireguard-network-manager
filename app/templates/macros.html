{% macro secret_reveal(value, uid) %}
<span id="secret-ph-{{ uid }}"><code class="text-body-secondary">{{ "•" * 44 }}</code></span>
<span id="secret-val-{{ uid }}" class="d-none"><code>{{ value }}</code></span>
<button type="button" class="btn btn-link p-0 ms-1" data-target="secret-val-{{ uid }}" data-placeholder="secret-ph-{{ uid }}" onclick="toggleSecret(this)" title="Show/hide">
  <i class="bi bi-eye"></i>
</button>
{% endmacro %}
